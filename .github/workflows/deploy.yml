name: Deploy to iwinv

# 사이트 배포: GitHub 에서 빌드 → iwinv 서버(/srv/eloan/app)로 보내고 → 서비스 재시작.
# (2026-11 Vercel 무료 한도 초과로 사이트가 멈춰, 이미 운영 중인 iwinv 서버로 옮김)
#
# 서버는 메모리 2GB 를 다른 사이트와 함께 써서 서버에서 빌드하지 않는다 (빌드는 1.5GB 이상 먹음).
# 서버 쪽 준비(한 번만): Node 20, 배포 계정 eloan, systemd 서비스 eloan(127.0.0.1:3100), nginx 프록시.
#
# 필요한 GitHub Secrets:
#   IWINV_SSH_KEY                   — 서버 /root/eloan_deploy_key (배포 계정 eloan 접속용 개인 키)
#   NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY / SUPABASE_SERVICE_ROLE_KEY — 기존 값 재사용
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 배포가 겹치면 앞의 것을 끝까지 하고 다음 것을 한다 (중간에 끊으면 서버 파일이 반쯤 바뀐 채 남음)
concurrency:
  group: deploy-iwinv
  cancel-in-progress: false

env:
  DEPLOY_HOST: 115.68.229.136
  DEPLOY_USER: eloan
  DEPLOY_DIR: /srv/eloan/app

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: https://www.eloan.kr

      # standalone 묶음 + 정적 파일 + public 을 한 폴더로 (Next 공식 standalone 실행 방식)
      - name: Assemble
        run: |
          rm -rf deploy && mkdir deploy
          cp -r .next/standalone/. deploy/
          mkdir -p deploy/.next && cp -r .next/static deploy/.next/static
          if [ -d public ]; then cp -r public deploy/public; fi
          mkdir -p deploy/ops && cp scripts/server/notion-cron.sh deploy/ops/ && chmod +x deploy/ops/notion-cron.sh
          test -f deploy/server.js

      # 실행 때 필요한 값 (.env 는 서버에만 두고 저장소에는 올리지 않음)
      # NOTION_CRON_SECRET: 서버 안 매시 동기화(ops/notion-cron.sh)가 쓰는 값 — Supabase shop_secrets 에서 그대로 가져온다
      #   (사이트 API 는 shop_secrets 값과 비교하므로 따로 관리할 값이 아님). 못 가져오면 배포는 하고 경고만 남긴다
      - name: Write runtime env
        run: |
          umask 077
          CRON_SECRET=$(curl -fsS -m 20 "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/shop_secrets?name=eq.NOTION_CRON_SECRET&select=value" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); print(r[0]["value"] if r else "")' || true)
          if [ -n "$CRON_SECRET" ]; then echo "::add-mask::$CRON_SECRET"; else echo "::warning::NOTION_CRON_SECRET 을 못 가져와 서버 매시 동기화가 실패로 기록돼요"; fi
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}"
            echo "SITE_URL=https://www.eloan.kr"
            echo "NOTION_CRON_SECRET=${CRON_SECRET}"
          } > deploy/.env
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # 키를 휴대폰·웹 콘솔에서 복사하면 줄바꿈이 빠지거나(한 줄로 붙음) 공백·\r 이 섞여
      # "error in libcrypto" 로 실패한다 (2026-11-16 첫 배포에서 실제로 겪음).
      # 그래서 BEGIN/END 사이 본문의 공백을 모두 지우고 70자씩 다시 줄을 맞춰 원래 모양으로 되살린다.
      # 키 파일을 base64 한 줄(`base64 -w0 /root/eloan_deploy_key`)로 넣어도 받는다.
      - name: SSH setup
        run: |
          install -d -m 700 ~/.ssh
          python3 scripts/ci/write-ssh-key.py
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null || { echo "::error::IWINV_SSH_KEY 키가 손상됐어요 — 서버에서 다시 복사해 넣어 주세요"; exit 1; }
          ssh-keyscan -T 15 "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
        env:
          IWINV_SSH_KEY: ${{ secrets.IWINV_SSH_KEY }}

      # --delete: 지난 배포의 남은 파일 정리. 페이지 캐시(.next/cache)도 같이 비워져 새 코드로 다시 만들어진다
      - name: Upload
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -o BatchMode=yes" \
            deploy/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/"

      - name: Restart
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo /usr/bin/systemctl restart eloan && sleep 5 && sudo /usr/bin/systemctl is-active eloan && curl -fsS -o /dev/null -w 'HTTP %{http_code}\n' http://127.0.0.1:3100/"

      # 매시 노션 동기화 예약 (배포 계정 crontab, 매시 2분) — scripts/server/notion-cron.sh 주석 참고.
      # 이 표시가 붙은 줄만 지우고 다시 넣으므로 몇 번 배포해도 한 줄만 남는다
      - name: Install schedule
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "(crontab -l 2>/dev/null | grep -v 'eloan-notion-cron'; echo '2 * * * * $DEPLOY_DIR/ops/notion-cron.sh # eloan-notion-cron') | crontab - && crontab -l | grep eloan-notion-cron"
