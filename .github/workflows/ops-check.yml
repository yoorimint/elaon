name: ops check

# 운영 점검 (읽기만 함): 작업 브랜치(ccr-*)에서 .github/ops-check-request 를 바꿔 push 하면 1회 실행.
# 사장님께 서버 명령을 시키지 않고 운영자(Claude)가 직접 확인하려고 만든 것 (2026-11-16 iwinv 이전 후).
#  1) 바깥에서: 주요 페이지 응답 코드, 실제 HTTPS 인증서 만료일 (GitHub 서버에서 보므로 중계 없이 진짜 인증서)
#  2) 서버 안(배포 계정 eloan, 읽기 전용 명령만): 서비스 상태·메모리·디스크·재부팅 필요 여부
#  3) Supabase: 노션 예약 실행(서버 crontab → /api/shop/notion-sync) 마지막 기록 — 쇼핑 글·일반 글(생활정보) 섹션 각각
#     + 무료 한도 사용량(사진 저장 용량·글 수·DB 추정 — scripts/ops/usage.ts)
#     + 글 조회수 표(shop_post_views)가 있는지와 최근 7일(한국시간) 합계 — 쇼핑·생활정보 섹션별
# 저장소가 공개라 로그도 공개 — 비밀값·방문자 IP 는 찍지 않는다.
on:
  push:
    branches: ["ccr-*"]
    paths: [".github/ops-check-request"]
  workflow_dispatch:

permissions:
  contents: read

env:
  DEPLOY_HOST: 115.68.229.136
  DEPLOY_USER: eloan
  SITE: https://www.eloan.kr

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 바깥에서 페이지·인증서
        run: |
          for p in / /picks /picks/study/megastudy /shop /info /community /login /admin/shop /sitemap.xml /rss.xml /backtest /stock/005930; do
            curl -s -o /dev/null -m 30 -w "$p %{http_code} %{time_total}s\n" "$SITE$p" || echo "$p 실패"
          done
          echo "--- eloan.kr → $(curl -sI -m 20 https://eloan.kr/ | grep -i '^location' | tr -d '\r')"
          echo "--- 인증서"
          echo | timeout 20 openssl s_client -connect www.eloan.kr:443 -servername www.eloan.kr 2>/dev/null \
            | openssl x509 -noout -subject -issuer -enddate

      # 사장님 휴대폰처럼 아직 옛 Vercel 화면이 뜨는지: 통신사 DNS 가 어느 주소를 주는지 (정답 115.68.229.136)
      - name: DNS (통신사·위임)
        run: |
          sudo apt-get install -y -qq dnsutils > /dev/null 2>&1 || true
          for r in "KT 168.126.63.1" "KT2 168.126.63.2" "SK 210.220.163.82" "SK2 219.250.36.130" "LG 164.124.101.2" "LG2 203.248.252.2" "구글 8.8.8.8" "클라우드플레어 1.1.1.1"; do
            set -- $r
            # 두 번째 칸 = 그 DNS 가 앞으로 이 답을 더 기억할 초 (옛 Vercel 답이면 이 시간이 지나야 새 주소로 바뀜)
            echo "$1($2): www=$(dig +noall +answer +time=3 +tries=1 @$2 www.eloan.kr A | awk '{print $2"초", $5}' | tr "\n" " ") / 루트=$(dig +short +time=3 +tries=1 @$2 eloan.kr A | tr "\n" " ")"
          done
          TLD=$(dig +short kr. NS | head -1)
          echo "--- .kr 등록소($TLD)가 알려 주는 네임서버:"; dig +norec +time=5 @"$TLD" eloan.kr NS | grep -E "IN\s+NS" | awk '{print $1, $2, $5}'
          for ns in $(dig +norec +time=5 @"$TLD" eloan.kr NS | awk '/IN[[:space:]]+NS/ {print $5}' | sort -u); do
            echo "--- $ns 답: www=$(dig +short +time=3 @$ns www.eloan.kr | tr "\n" " ") 루트=$(dig +short +time=3 @$ns eloan.kr | tr "\n" " ")"
          done

      - name: 서버 상태 (읽기 전용)
        env:
          IWINV_SSH_KEY: ${{ secrets.IWINV_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          python3 scripts/ci/write-ssh-key.py
          ssh-keyscan -T 15 "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" '
            echo "서비스: eloan=$(systemctl is-active eloan) nginx=$(systemctl is-active nginx) sajuday=$(systemctl is-active sajuday 2>/dev/null)"
            echo "eloan $(systemctl show eloan -p MemoryCurrent -p ActiveEnterTimestamp -p NRestarts | tr "\n" " ")"
            echo "--- 메모리"; free -m
            echo "--- 디스크"; df -h / | tail -1
            echo "--- 가동"; uptime
            echo "--- 재부팅 필요: $( [ -f /var/run/reboot-required ] && echo 예 || echo 아니오 )"
            # 바깥으로 나간 트래픽(iwinv 는 아웃바운드만 과금) — 부팅 후 누적 ÷ 가동일 = 하루 평균 (서버 전체, 다른 사이트 포함)
            awk -v up="$(cut -d. -f1 /proc/uptime)" '\''$1 ~ /^(ens|eth)[0-9]+:/ {rx=$2; tx=$10; printf "--- 트래픽(%s): 나감 %.1fGB, 들어옴 %.1fGB, 하루 평균 나감 %.2fGB\n", $1, tx/1e9, rx/1e9, tx/1e9/(up/86400)}'\'' /proc/net/dev
            echo "--- 인증서 자동갱신 타이머: $(systemctl is-active certbot.timer 2>/dev/null) / $(systemctl is-enabled certbot.timer 2>/dev/null)"
            # 서버 안 매시 노션 동기화 (배포가 설치 — scripts/server/notion-cron.sh). 기록은 시각·응답코드·걸린 시간뿐
            echo "--- 예약: cron=$(systemctl is-active cron 2>/dev/null) / crontab: $(crontab -l 2>&1 | grep -v "^#" | tr "\n" " ")"
            echo "--- 매시 동기화 최근 기록 (UTC):"; tail -n 6 /srv/eloan/notion-cron.log 2>/dev/null || echo "아직 기록 없음"
            # 같은 매시 스크립트가 남기는 송신 누적 바이트 (관리자 화면 사용량 카드의 오늘·어제 계산용, 최근 9일)
            echo "--- 트래픽 기록 (UTC 시각, 누적 송신 바이트): $(wc -l 2>/dev/null < /srv/eloan/traffic.log || echo 0)줄"; tail -n 3 /srv/eloan/traffic.log 2>/dev/null || echo "아직 기록 없음"
          '

      - name: 노션 예약 실행 마지막 기록 (Supabase)
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -s -m 20 "$SUPABASE_URL/rest/v1/shop_config?id=eq.1&select=notion_sync,notion_schedule" \
            -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" | python3 -c '
          import json, sys
          rows = json.load(sys.stdin)
          if not isinstance(rows, list) or not rows:
              print("읽기 실패:", str(rows)[:200]); sys.exit(0)
          st = rows[0].get("notion_sync") or {}
          sch = rows[0].get("notion_schedule") or {}
          # 섹션: 쇼핑 글은 칸 맨 위(예전 그대로), 일반 글(생활정보)은 하위 키 info (src/lib/notion-section.ts)
          def show(name, part, schedule, default):
              last = part.get("lastRun") or {}
              keep = {k: v for k, v in last.items() if k not in ("items",)}
              print(f"[{name}] 마지막 실행:", json.dumps(keep, ensure_ascii=False) if keep else "아직 없음")
              print(f"[{name}] 발행 일정:", json.dumps(schedule, ensure_ascii=False) if schedule else f"저장 안 됨 → 기본값 {default}")
              print(f"[{name}] 이번 시 발행 기록:", json.dumps(part.get("publishSlot"), ensure_ascii=False))
              print(f"[{name}] 대기열:", len(part.get("queue") or {}), "편 · 데이터베이스:", part.get("databaseId") or "아직 없음")
          show("쇼핑 글", {k: v for k, v in st.items() if k != "info"}, {k: v for k, v in sch.items() if k != "info"}, "1·9·17시 1편")
          show("일반 글", st.get("info") or {}, sch.get("info"), "19시 1편")
          '

      # 글 조회수(supabase/shop-views.sql): 표가 실제로 있는지 + 최근 7일(한국시간, 오늘 포함) 합계를 섹션별로. 읽기만 한다.
      # 조회수 표에는 글 id 만 있어 shop_posts 의 id·content->>section 을 따로 읽어 합친다 (섹션 규칙은 src/lib/post-section.ts 와 같게: "info" 만 생활정보)
      - name: 글 조회수 (섹션별 최근 7일)
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 - <<'PY'
          import collections, datetime, json, os, sys, urllib.error, urllib.request
          base = os.environ["SUPABASE_URL"].rstrip("/") + "/rest/v1/"
          key = os.environ["SERVICE_KEY"]
          def get(path):
              req = urllib.request.Request(base + path, headers={"apikey": key, "Authorization": "Bearer " + key})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return r.status, json.load(r)
              except urllib.error.HTTPError as e:
                  try:
                      return e.code, json.load(e)
                  except Exception:
                      return e.code, {}
              except Exception as e:
                  return 0, {"message": str(e)}
          today = (datetime.datetime.now(datetime.timezone.utc) + datetime.timedelta(hours=9)).date()
          since = today - datetime.timedelta(days=6)
          st, views = get(f"shop_post_views?select=post_id,view_day,view_count&view_day=gte.{since}&limit=10000")
          if st != 200 or not isinstance(views, list):
              code = views.get("code") if isinstance(views, dict) else None
              # 42P01 = 표 없음(Postgres), PGRST205 = PostgREST 가 표를 모름
              if code in ("42P01", "PGRST205") or st == 404:
                  print("조회수 표 없음 — supabase/shop-views.sql 미실행"); sys.exit(0)
              print("조회수 읽기 실패:", st, str(views)[:200]); sys.exit(0)
          print(f"조회수 표 있음 — {since} ~ {today} 기록 {len(views)}줄" + (" (응답 줄 수 상한일 수 있음 — 일부만)" if len(views) >= 1000 else ""))
          st, posts = get("shop_posts?select=id,section:content->>section&limit=10000")
          if st != 200 or not isinstance(posts, list):
              print("글 섹션 읽기 실패:", st, str(posts)[:200]); sys.exit(0)
          section = {p["id"]: ("생활정보" if p.get("section") == "info" else "쇼핑") for p in posts}
          week, day, read = collections.Counter(), collections.Counter(), collections.defaultdict(set)
          for v in views:
              s = section.get(v["post_id"], "알 수 없는 글")
              week[s] += int(v.get("view_count") or 0)
              if v.get("view_day") == str(today):
                  day[s] += int(v.get("view_count") or 0)
              read[s].add(v["post_id"])
          for s in ["쇼핑", "생활정보"] + [k for k in week if k not in ("쇼핑", "생활정보")]:
              print(f"[{s}] 최근 7일 {week[s]:,} · 오늘 {day[s]:,} · 조회된 글 {len(read[s])}편")
          PY

      # Supabase 무료 한도 사용량: 사진 저장(1GB 대비 %)·글 수·DB 추정 (scripts/ops/usage.ts — 매일 감시 usage-watch.yml 과 같은 계산).
      # 여기서는 보기만 한다 (70% 이상이어도 이 점검은 실패시키지 않음)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Supabase 사용량
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx --tsconfig tsconfig.json scripts/ops/usage.ts || echo "사용량 조회 실패 (점검은 계속)"

      # 예약 실행 경로를 GitHub 에서 똑같이 불러 본다 (Supabase pg_cron 이 보내는 것과 같은 비밀값 헤더).
      # 응답 200 이면 사이트·인증은 정상 → 예약이 안 돈 원인은 Supabase 쪽(옛 주소 기억·예약 작업 상태).
      # 지금이 발행 시각이 아니면 새 글은 안 올리고 수정·내림만 반영한다 (예약 실행과 같은 규칙).
      - name: 예약 실행 경로 직접 호출
        if: contains(github.event.head_commit.message, '예약경로')
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          SECRET=$(curl -s -m 20 "$SUPABASE_URL/rest/v1/shop_secrets?name=eq.NOTION_CRON_SECRET&select=value" \
            -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" | python3 -c 'import json,sys; r=json.load(sys.stdin); print(r[0]["value"] if r else "")')
          if [ -z "$SECRET" ]; then echo "비밀값 없음 (SQL 미실행?)"; exit 0; fi
          echo "::add-mask::$SECRET"
          curl -s -m 70 -o /tmp/r.json -w "응답 %{http_code} (%{time_total}s)\n" -X POST "$SITE/api/shop/notion-sync" \
            -H "content-type: application/json" -H "x-notion-cron-secret: $SECRET" -d '{}'
          python3 -c 'import json; d=json.load(open("/tmp/r.json")); s=d.get("summary",d); i=s.get("info") if isinstance(s,dict) else None; print({k:v for k,v in s.items() if k not in ("items","info")} if isinstance(s,dict) else str(d)[:300]); print("일반 글:", {k:v for k,v in i.items() if k!="items"} if isinstance(i,dict) else "없음")' || head -c 300 /tmp/r.json

      # 커뮤니티 실제 이용 현황 (글·댓글 수, 봇 제외) — 개인정보 없이 숫자만
      - name: 커뮤니티 이용 현황
        if: contains(github.event.head_commit.message, '커뮤니티')
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cnt() { curl -s -m 20 -o /dev/null -D - "$SUPABASE_URL/rest/v1/$1&select=id" -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" -H "Prefer: count=exact" -H "Range: 0-0" | grep -i '^content-range' | sed 's/.*\///' | tr -d '\r'; }
          since90=$(date -u -d '90 days ago' +%Y-%m-%dT%H:%M:%SZ); since30=$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "글 전체(봇 제외): $(cnt 'posts?category=neq.bot')  / 봇 글: $(cnt 'posts?category=eq.bot')"
          echo "글 최근 90일(봇 제외): $(cnt "posts?category=neq.bot&created_at=gte.$since90")  / 최근 30일: $(cnt "posts?category=neq.bot&created_at=gte.$since30")"
          echo "댓글 전체: $(cnt 'comments?id=not.is.null')  / 최근 30일: $(cnt "comments?created_at=gte.$since30")"
          echo "--- 최근 90일 사람 글 카테고리별"
          curl -s -m 20 "$SUPABASE_URL/rest/v1/posts?category=neq.bot&created_at=gte.$since90&select=category,created_at" -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" | python3 -c 'import json,sys,collections; r=json.load(sys.stdin); print(dict(collections.Counter(x["category"] for x in r))); print("가장 최근:", max((x["created_at"] for x in r), default="없음"))'

      # 쇼핑/생활정보 섹션 조회 조건이 실제 Supabase(PostgREST)에서 맞게 도는지 (src/lib/post-section.ts 와 같은 조건)
      - name: 섹션 조회 조건 확인
        if: contains(github.event.head_commit.message, '섹션조건')
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          q() { curl -s -m 20 "$SUPABASE_URL/rest/v1/shop_posts?select=slug&status=eq.published&$1" -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" | python3 -c 'import json,sys; r=json.load(sys.stdin); print(len(r) if isinstance(r,list) else r, [x["slug"] for x in r] if isinstance(r,list) else "")'; }
          echo "전체 공개: $(q '')"
          echo "쇼핑 조건: $(q 'or=(content->>section.is.null,content->>section.neq.info)')"
          echo "생활정보 조건: $(q 'content->>section=eq.info')"

      # 섹션 대기 글 1편만 지금 올리기 (사장님 요청 때 운영자가 수동으로) — 커밋 메시지에 '한편발행:info' 또는 '한편발행:shop'
      - name: 대기 글 1편만 지금 올리기
        if: contains(github.event.head_commit.message, '한편발행:')
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          SECTION=$(printf '%s' "$MSG" | grep -o '한편발행:[a-z]*' | head -1 | cut -d: -f2)
          case "$SECTION" in shop|info) ;; *) echo "섹션 이름이 이상해요: $SECTION"; exit 1 ;; esac
          SECRET=$(curl -s -m 20 "$SUPABASE_URL/rest/v1/shop_secrets?name=eq.NOTION_CRON_SECRET&select=value" \
            -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" | python3 -c 'import json,sys; r=json.load(sys.stdin); print(r[0]["value"] if r else "")')
          echo "::add-mask::$SECRET"
          curl -s -m 70 -o /tmp/one.json -w "응답 %{http_code} (%{time_total}s)\n" -X POST "$SITE/api/shop/notion-sync" \
            -H "content-type: application/json" -H "x-notion-cron-secret: $SECRET" -d "{\"mode\":\"one\",\"section\":\"$SECTION\"}"
          python3 -c 'import json,sys; d=json.load(open("/tmp/one.json")); s=(d.get("info") if sys.argv[1]=="info" else d) or {}; print({k:v for k,v in s.items() if k!="items"}); [print("-", i.get("action"), i.get("title"), i.get("slug")) for i in (s.get("items") or [])]' "$SECTION"
