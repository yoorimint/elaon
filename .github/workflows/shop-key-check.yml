name: shop key check

# 관리자 페이지(/admin/shop)에 저장한 API 키가 실제로 동작하는지 점검.
# 결과는 관리자 페이지 "API 키" 섹션에 표시된다.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shop-key-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check API keys
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx --tsconfig tsconfig.json scripts/shop/check-keys.ts
