name: shop notion sync

# 노션 "쇼핑 글" 데이터베이스 → 사이트 쇼핑 글 (scripts/shop/notion-sync.ts) — 수동 실행 전용 예비 경로.
# 예약 실행(schedule)은 뺐다: GitHub 예약 실행이 이 저장소에서 수시간씩 누락됨
#   (2026-11-13 18:48Z 이후 7시간 동안 모든 예약 작업이 0회 실행).
# 평소 예약 실행은 Supabase pg_cron 이 8시간마다(한국시간 오전 9시·오후 5시·새벽 1시) 사이트 API 를 부른다
#   (supabase/shop-notion-cron.sql → POST /api/shop/notion-sync). 새 글은 실행마다 1편씩 공개.
# 바로 전부 올리고 싶으면 관리자 화면 /admin/shop → "📒 노션" 탭의 "지금 노션에서 가져오기" (같은 모듈).
# 노션 토큰은 관리자 화면에 저장한 값(shop_secrets.NOTION_TOKEN)을 읽는다. 토큰이 없으면 아무것도 안 하고 끝남.
on:
  workflow_dispatch:

permissions:
  contents: read

# 이전 실행이 아직 돌고 있으면 기다렸다가 이어서 (같은 페이지를 두 번 처리하지 않게)
concurrency:
  group: shop-notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Sync from Notion
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx --tsconfig tsconfig.json scripts/shop/notion-sync.ts
