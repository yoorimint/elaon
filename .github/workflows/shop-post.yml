name: shop post

# 쿠팡 비교글 자동 작성. 설정·키·상품은 관리자 페이지(/admin/shop)에서 관리.
# - 스케줄: 꺼 둠 (2026-11-13 운영자 지시 — 글은 관리자 화면에서 직접 붙여넣어 만들기로 바꿈).
#   다시 켜려면 아래 on: 에 다음 두 줄을 되살리면 된다 (매시간 실행, 스크립트가 "작성 시각·하루 글 수·활성화" 를 확인해 해당될 때만 작성)
#     schedule:
#       - cron: "17 * * * *"
# - 수동 실행: 조건 무시하고 지금 1회 작성 (발행 방식 설정은 그대로 따름)
# - 점검 실행: 작업 브랜치(ccr-*)에서 .github/shop-run-request 파일이 바뀌면 그 브랜치 코드로 1회 작성
#   (수정한 코드를 main 에 합치기 전에 실제로 돌려 보고 초안을 검토하는 용도. 다른 파일 변경으로는 실행 안 됨)
on:
  workflow_dispatch:
  push:
    branches: ["ccr-*"]
    paths: [".github/shop-run-request"]

permissions:
  contents: read

concurrency:
  group: shop-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 자동 검수 회귀 테스트 (외부 호출 없음). 깨져 있으면 글을 쓰지 않는다
      - name: QA self-test
        run: npm run test:shop
      # 점검 실행(push)에서만: shop-run-request 의 "type: single" 또는 "type: compare" 줄로 이번 글 종류 지정,
      # "probe: data|webreviews 제품1 | 제품2" 줄로 글 없이 데이터 진단만 실행.
      # 스케줄·수동 실행은 이 단계를 건너뛰어 관리자 설정(자동 글 종류)대로 돈다.
      - name: Read run request
        id: req
        if: github.event_name == 'push'
        run: |
          echo "kind=$(sed -n -E 's/^type:[[:space:]]*(single|compare)[[:space:]]*$/\1/p' .github/shop-run-request | head -n 1)" >> "$GITHUB_OUTPUT"
          echo "probe=$(sed -n -E 's/^probe:[[:space:]]*((data|webreviews)[[:space:]]+.+)$/\1/p' .github/shop-run-request | head -n 1)" >> "$GITHUB_OUTPUT"
      # 점검 실행에서 "probe: data 제품1 | 제품2" (원재료 전부 수집 + 후기 분석까지) 또는
      # "probe: webreviews 제품1 | 제품2" (웹 리뷰만) 줄이 있으면 글을 쓰지 않고 데이터만 진단한다 (scripts/shop/probe.ts)
      - name: Probe data
        if: steps.req.outputs.probe != ''
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHOP_PROBE: ${{ steps.req.outputs.probe }}
        run: npx tsx --tsconfig tsconfig.json scripts/shop/probe.ts
      - name: Generate post
        if: steps.req.outputs.probe == ''
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHOP_FORCE: ${{ github.event_name != 'schedule' && '1' || '' }}
          SHOP_KIND: ${{ steps.req.outputs.kind }}
        run: npx tsx --tsconfig tsconfig.json scripts/shop/generate-post.ts
