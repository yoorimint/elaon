name: Update DART + Yahoo financial data

on:
  schedule:
    # 매일 1회 — 03:00 UTC (한국 12:00, 점심시간) — 오전 공시 반영
    - cron: "0 3 * * *"
  workflow_dispatch: # 수동 실행 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Node deps
        run: npm install --no-save fflate
      - name: Install Python deps
        run: pip install yfinance
      - name: Download corpCode.xml and generate mapping
        env:
          OPEN_DART_API_KEY: ${{ secrets.OPEN_DART_API_KEY }}
        run: node scripts/build-corp-codes.mjs
      - name: Fetch DART financial + filing data (KR)
        env:
          OPEN_DART_API_KEY: ${{ secrets.OPEN_DART_API_KEY }}
        run: node scripts/fetch-dart-financials.mjs
      - name: Fetch Yahoo financial data (US)
        run: python scripts/fetch-yahoo-financials.py
      - name: Check if changed
        id: diff
        run: |
          if git diff --quiet src/lib/dart-corps-data.ts src/lib/dart-financial-data.ts src/lib/dart-filings-data.ts src/lib/yahoo-financial-data.ts; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/dart-corps-data.ts src/lib/dart-financial-data.ts src/lib/dart-filings-data.ts src/lib/yahoo-financial-data.ts
          git commit -m "chore(data): auto-update DART + Yahoo financial data"
          git push
