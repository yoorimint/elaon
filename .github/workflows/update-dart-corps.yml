name: Update DART + Yahoo financial data

on:
  schedule:
    # 매일 1회 — 03:00 UTC (한국 12:00, 점심시간) — 오전 공시 반영
    - cron: "0 3 * * *"
  workflow_dispatch: # 수동 실행 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Node deps
        run: npm install --no-save fflate
      - name: Install Python deps
        run: pip install yfinance

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ─── DART (한국) ─────────────────────────────────────
      - name: Download corpCode.xml and generate mapping
        env:
          OPEN_DART_API_KEY: ${{ secrets.OPEN_DART_API_KEY }}
        run: node scripts/build-corp-codes.mjs
      - name: Fetch DART financial + filing data (KR)
        env:
          OPEN_DART_API_KEY: ${{ secrets.OPEN_DART_API_KEY }}
        run: node scripts/fetch-dart-financials.mjs
      - name: Commit DART data (이후 단계 실패해도 보존)
        run: |
          git add src/lib/dart-corps-data.ts src/lib/dart-financial-data.ts src/lib/dart-filings-data.ts || true
          git diff --cached --quiet || git commit -m "chore(dart): auto-update KR data"
          git pull --rebase origin main || true
          git push origin HEAD:main || true

      # ─── Yahoo (미국) ────────────────────────────────────
      - name: Fetch Yahoo financial data (US)
        run: python scripts/fetch-yahoo-financials.py
      - name: Commit Yahoo data
        run: |
          git add src/lib/yahoo-financial-data.ts || true
          git diff --cached --quiet || git commit -m "chore(yahoo): auto-update US financial data"
          git pull --rebase origin main || true
          git push origin HEAD:main || true

      # ─── SEC (미국) ──────────────────────────────────────
      - name: Fetch SEC EDGAR filings (US)
        run: python scripts/fetch-sec-filings.py
      - name: Commit SEC data
        run: |
          git add src/lib/sec-filings-data.ts || true
          git diff --cached --quiet || git commit -m "chore(sec): auto-update US filings"
          git pull --rebase origin main || true
          git push origin HEAD:main || true

      # ─── 검색 인덱스 ──────────────────────────────────────
      - name: Build stocks autocomplete index (KR + US + 한글명)
        env:
          OPEN_DART_API_KEY: ${{ secrets.OPEN_DART_API_KEY }}
        run: node scripts/build-stocks-index.mjs
      - name: Commit stocks index
        run: |
          git add public/stocks-index.json || true
          git diff --cached --quiet || git commit -m "chore(search): auto-update stocks index"
          git pull --rebase origin main || true
          git push origin HEAD:main || true
