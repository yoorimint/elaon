name: Update DART data (corp_codes + financials)

on:
  schedule:
    # 매주 월요일 03:00 UTC (한국 시각 12:00)
    - cron: "0 3 * * 1"
  workflow_dispatch: # 수동 실행 가능

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/improve-address-search-engagement-HMBcH
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install fflate
        run: npm install --no-save fflate
      - name: Download corpCode.xml and generate mapping
        env:
          OPEN_DART_API_KEY: ${{ secrets.OPEN_DART_API_KEY }}
        run: node scripts/build-corp-codes.mjs
      - name: Fetch financial + filing data for popular stocks
        env:
          OPEN_DART_API_KEY: ${{ secrets.OPEN_DART_API_KEY }}
        run: node scripts/fetch-dart-financials.mjs
      - name: Check if changed
        id: diff
        run: |
          if git diff --quiet src/lib/dart-corps-data.ts src/lib/dart-financial-data.ts src/lib/dart-filings-data.ts; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/dart-corps-data.ts src/lib/dart-financial-data.ts src/lib/dart-filings-data.ts
          git commit -m "chore(dart): auto-update corp_code + financial data"
          git push
